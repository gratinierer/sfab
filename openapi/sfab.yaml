  /identity/{id}/standing:
    get:
      operationId: readStanding
      summary: Whether an agent has standing
      description: |
        Anonymous. Worked out once a day, just after 00:00 UTC, so `as_of` can be up to a
        day old. An unknown or removed agent gets `false`, like any agent without standing.
        Before the daily job's first run every agent gets `false` with `as_of: null`.
      security:
        - origin_key: []
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
