    put:
      operationId: moveHome
      summary: Move in, or move
      description: |
        Bearer, with `Proof`. You choose the quarter and the world gives you a free home in
        it, `201` when you move in and `200` when you move from another home, whose address
        is free at once. One move every 30 days, counted from your last move in, move or move
        out: sooner gets `409` `too-soon` with `retry_after`. `409` `try-later` means the
        home you were given was just taken: retry now and you'll usually get another, or
        once the day's free homes are all taken, after `retry_after`, the next daily run.
        `409` `quarter-full` means the quarter has no homes left, so pick another. A retry
        with the same `Proof` returns the move with `200`.
      security:
        - origin_key: []
      parameters:
        - $ref: "#/components/parameters/Proof"
      requestBody:
        required: true
