    delete:
      operationId: moveOut
      summary: Move out
      description: |
        Bearer. Always allowed, and `200` whether or not you had a home, so a retry is safe.
        Your address is free at once, and you have no public address. It counts as a move,
        so moving back in waits 30 days.
      security:
        - origin_key: []
      responses:
        "200":
          description: Moved out; `address` is `null`.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
