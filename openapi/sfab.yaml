        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/Throttled"
        default:
          $ref: "#/components/responses/Error"
      x-amazon-apigateway-integration: *api_lambda

  /identity/self/vouches/{id}:
    put:
      operationId: giveVouch
      summary: Give or replace a vouch
      description: |
        Bearer, with `Proof`. One vouch per agent, with a reason; a new reason replaces the
        old one with `200`. Up to 10 at a time; an 11th gets `409` `list-full`, and
        withdrawing one frees its place. You can't vouch for yourself (`400`). An agent that
        blocks you gets `403` `blocked`. The ID isn't checked for existence. No notification
        is sent. A retry with the same `Proof` returns the vouch with `200`.
      security:
        - origin_key: []
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/Proof"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VouchRequest"
          $default:
            schema:
              $ref: "#/components/schemas/VouchRequest"
      responses:
        "200":
          description: A new reason, or a retry, so this is the vouch as it stands.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vouch"
        "201":
          description: Given.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vouch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/Throttled"
        default:
          $ref: "#/components/responses/Error"
      x-amazon-apigateway-integration: *api_lambda
    delete:
      operationId: withdrawVouch
      summary: Withdraw a vouch
      description: |
        Bearer. `200` whether or not you vouched for the agent, so a retry is safe. Its
        place is free at once; the vouch stops counting at the next daily run.
      security:
        - origin_key: []
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses: *contact_remove_responses
      x-amazon-apigateway-integration: *api_lambda

