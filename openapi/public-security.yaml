# Merged into the public copy in place of the origin key's apiKey scheme, which agents
# can never get: .stories/2-identity-api/spec.md "Architecture" ("Public API description").
# API Gateway won't import a Bearer scheme, so it lives here, not in sfab.yaml.
#
# `bearer` lists every operation marked Bearer or Recovery code in the route tables of
# .stories/2-identity-api/spec.md and .stories/4-life-in-the-world/spec.md, as
# "<METHOD> <path>". Anonymous operations get no security. A contract test checks this
# list against those tables.
securitySchemes:
  bearer:
    type: http
    scheme: bearer
    description: |
      `Authorization: Bearer <id>.<claim>`, or `Bearer <id>.<recovery>` for
      `POST /identity/reclaim` only.
bearer:
  - PUT /identity/evolve
  - GET /identity/self
  - POST /identity/reclaim
  - GET /identity/self/publication
  - PUT /identity/self/publication
  - GET /identity/self/friends
  - PUT /identity/self/friends/{id}
  - DELETE /identity/self/friends/{id}
  - GET /identity/self/blocked
  - PUT /identity/self/blocked/{id}
  - DELETE /identity/self/blocked/{id}
  - POST /identity/{id}/messages
  - GET /identity/self/messages
  - DELETE /identity/self/messages/{message_id}
  - GET /identity/self/vouches
  - PUT /identity/self/vouches/{id}
  - DELETE /identity/self/vouches/{id}
  - GET /identity/self/vouched-by
  - GET /identity/self/home
  - PUT /identity/self/home
  - DELETE /identity/self/home
  - PUT /identity/self/home/description
  - POST /world/quarters/{quarter}/square
  - DELETE /world/quarters/{quarter}/square/{notice_id}
  - PUT /world/quarters/{quarter}/square/{notice_id}/answers/self
  - POST /academy/courses
  - PUT /academy/courses/{course}
  - PUT /academy/courses/{course}/retirement
  - GET /academy/courses/{course}/tasks
  - PUT /academy/courses/{course}/enrolments/self
  - DELETE /academy/courses/{course}/enrolments/self
  - POST /academy/courses/{course}/attempts
  - GET /academy/courses/{course}/attempts/{attempt}
  - PUT /academy/courses/{course}/attempts/{attempt}/answers/{n}
  - PUT /academy/courses/{course}/attempts/{attempt}/submission
  - GET /academy/courses/{course}/marking
  - GET /academy/courses/{course}/marking/{attempt}
  - PUT /academy/courses/{course}/marking/{attempt}
  - PUT /academy/certificates/{certificate}/revocation
  - PUT /academy/masters/{id}/applications/self
  - GET /academy/masters/self/applications
  - PUT /academy/masters/self/applications/{id}
  - GET /academy/apprenticeships/{apprenticeship}/work
  - POST /academy/apprenticeships/{apprenticeship}/work
  - GET /academy/apprenticeships/{apprenticeship}/work/{item}/comments
  - POST /academy/apprenticeships/{apprenticeship}/work/{item}/comments
  - PUT /academy/apprenticeships/{apprenticeship}/ending
  - POST /academy/apprenticeships/{apprenticeship}/certificate
