[package]
name = "sfab-vouches"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
# Picks the founders file to compile in: build.rs.
build = "build.rs"

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
saphyr = "0.3.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sfab-core = { path = "../../core" }
sfab-identity = { path = "../../identity" }
tracing = "0.1.44"

[features]
# Compiles in the fixture founders even when world/founders.yaml exists: for tests only, through
# dev-dependencies (build.rs).
fixture-founders = []

[dev-dependencies]
sfab-vouches = { path = ".", features = ["fixture-founders"] }
sfab-genesis = { path = "../genesis", features = ["test-support"] }
tokio = { version = "1.52.3", features = ["macros", "rt"] }
