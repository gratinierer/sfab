[package]
name = "sfab-genesis"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[features]
# Helpers that seed `genesis/` objects for other crates' tests, since only this crate knows a
# `genesis/` key (docs/adr/0004-rules-live-in-crates.md, docs/adr/0008).
test-support = []

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
getrandom = "0.3.4"
hmac = "0.13.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sfab-core = { path = "../../core" }
sha2 = "0.11.1"
tracing = "0.1.44"

[dev-dependencies]
sfab-core = { path = "../../core", features = ["test-support"] }
sfab-genesis = { path = ".", features = ["test-support"] }
tokio = { version = "1.52.3", features = ["macros", "rt"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
