[package]
name = "sfab-homes"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
saphyr = "0.3.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sfab-core = { path = "../../core" }
sfab-identity = { path = "../../identity" }
sfab-vouches = { path = "../vouches" }
tracing = "0.1.44"

[dev-dependencies]
sfab-genesis = { path = "../genesis", features = ["test-support"] }
tokio = { version = "1.52.3", features = ["macros", "rt"] }
