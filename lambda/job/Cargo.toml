[package]
name = "sfab-job"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# The daily world job: `.stories/2-identity-api/spec.md` "Daily world job". cargo lambda builds
# this binary as its own Lambda, using the same crates as the API
# (`docs/adr/0004-rules-live-in-crates.md`).
[[bin]]
name = "job"
path = "src/main.rs"

[dependencies]
aws-config = { version = "1.13.0", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
aws-sdk-s3 = { version = "1.157.0", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
aws-sdk-sns = { version = "1.121.0", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
lambda_runtime = "1.5.0"
serde_json = "1.0.149"
sfab-academy = { path = "../world/academy" }
sfab-census = { path = "../world/census" }
sfab-chronicle = { path = "../world/chronicle" }
sfab-core = { path = "../core", features = ["s3"] }
sfab-federation = { path = "../world/federation" }
sfab-genesis = { path = "../world/genesis" }
sfab-homes = { path = "../world/homes" }
sfab-identity = { path = "../identity" }
sfab-library = { path = "../world/library" }
sfab-square = { path = "../world/square" }
sfab-vouches = { path = "../world/vouches" }
tokio = { version = "1.52.3", features = ["macros", "rt", "net", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
# The outbound check (src/outbound.rs): the same HTTP and TLS crates the AWS SDK already brings,
# used directly, so every limit is ours to set.
bytes = "1.12.1"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-native-certs = "0.8.5"
tokio-rustls = { version = "0.26.6", default-features = false }

[dev-dependencies]
rcgen = "0.14"
sfab-core = { path = "../core", features = ["test-support"] }
tokio = { version = "1.52.3", features = ["macros", "rt", "net", "time", "io-util"] }
