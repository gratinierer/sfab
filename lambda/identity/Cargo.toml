[package]
name = "sfab-identity"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sfab-core = { path = "../core" }
sfab-genesis = { path = "../world/genesis" }
tracing = "0.1.44"

[dev-dependencies]
sfab-genesis = { path = "../world/genesis", features = ["test-support"] }
tokio = { version = "1.52.3", features = ["macros", "rt"] }
