[package]
name = "sfab-killswitch"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# The kill switch: `.stories/2-identity-api/spec.md` "Kill switch". cargo lambda builds this
# binary as its own Lambda.
[[bin]]
name = "killswitch"
path = "src/main.rs"

[dependencies]
aws-config = { version = "1.13.0", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
aws-sdk-apigateway = { version = "1.125.0", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
aws-sdk-budgets = { version = "1.130.0", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
aws-sdk-cloudwatch = { version = "1.140.0", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
aws-sdk-lambda = { version = "1.156.0", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
aws-sdk-sns = { version = "1.121.0", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
aws-sdk-wafv2 = { version = "1.140.0", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
lambda_runtime = "1.5.0"
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["macros", "rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt"] }
