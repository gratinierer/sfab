[package]
name = "sfab-genesis-codes"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# The owner's tool to issue genesis codes and read the daily summary:
# `.stories/17-genesis-codes/spec.md` "Two sources" and "Tracking", and
# `docs/adr/0008-genesis-codes-get-a-crate-and-an-owner-tool.md`. It runs on the owner's machine,
# like takedown, not as a Lambda.
[[bin]]
name = "genesis-codes"
path = "src/main.rs"

[dependencies]
# credentials-login reads `aws login` sessions, which the owner runs this tool with
# (docs/aws-facts.md, the row on aws-config and `aws login`).
aws-config = { version = "1.13.0", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest", "credentials-login"] }
aws-sdk-s3 = { version = "1.157.0", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
sfab-core = { path = "../core", features = ["s3"] }
sfab-genesis = { path = "../world/genesis" }
tokio = { version = "1.52.3", features = ["macros", "rt"] }

[dev-dependencies]
sfab-genesis = { path = "../world/genesis", features = ["test-support"] }
serde_json = "1.0.149"
