[package]
name = "sfab-api"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# cargo lambda builds this binary as the API Lambda.
[[bin]]
name = "api"
path = "src/main.rs"

[dependencies]
aws-config = { version = "1.13.0", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
aws-sdk-s3 = { version = "1.157.0", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
axum = { version = "0.8.9", default-features = false, features = ["original-uri"] }
lambda_http = { version = "1.3.2", default-features = false, features = ["apigw_rest"] }
serde_json = "1.0.149"
sfab-core = { path = "../core", features = ["s3"] }
sfab-census = { path = "../world/census" }
sfab-constitution = { path = "../world/constitution" }
sfab-federation = { path = "../world/federation" }
sfab-identity = { path = "../identity" }
tokio = { version = "1.52.3", features = ["macros", "rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
regex = "1.13.1"
saphyr = "0.3.3"
tower = { version = "0.5.3", features = ["util"] }
