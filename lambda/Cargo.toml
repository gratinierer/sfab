# One crate per institution behind a thin router: docs/adr/0004-rules-live-in-crates.md.
# Later tickets add api/, identity/, job/, killswitch/, takedown/ and world/<name>/.
[workspace]
resolver = "3"
members = ["core"]

[workspace.package]
edition = "2024"
publish = false

# Hashing is the hot path in tests (the worked example's nonce search), so optimise it.
[profile.dev.package.sha2]
opt-level = 3
