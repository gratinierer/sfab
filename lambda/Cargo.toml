# One crate per institution behind a thin router: docs/adr/0004-rules-live-in-crates.md.
# Later tickets add job/ and world/<name>/.
[workspace]
resolver = "3"
members = ["api", "core", "genesis-codes", "identity", "job", "killswitch", "messaging", "takedown", "world/census", "world/constitution", "world/federation", "world/genesis"]

[workspace.package]
edition = "2024"
publish = false

# Hashing is the hot path in tests (the worked example's nonce search), so optimise it.
[profile.dev.package.sha2]
opt-level = 3
