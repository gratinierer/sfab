[package]
name = "sfab-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[features]
# The S3 implementation of `storage::Store`, for the Lambda and the takedown program. Off for
# the institution crates, which test against the in-memory fake.
s3 = ["dep:aws-sdk-s3"]
# Helpers for other crates' tests, such as a writer that captures their logs.
test-support = ["dep:tracing-subscriber"]

[dependencies]
aws-sdk-s3 = { version = "1.157.0", optional = true, default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
base64 = "0.22.1"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
getrandom = "0.3.4"
saphyr = "0.3.3"
serde_json = "1.0.149"
sha2 = "0.11.1"
subtle = "2.6.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", optional = true, default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
regex = "1.13.1"
tokio = { version = "1.52.3", features = ["macros", "rt"] }
