# Runs scripts/check, the same steps the devcontainer and the deploy script run:
# generate, build, audit, test. See .stories/2-identity-api/spec.md "Delivery".
# Actions are pinned by full commit hash, and only GitHub's own are used.
name: CI

# Manual only for now, so no Actions minutes go to routine runs (owner, 2026-11-04).
# Run scripts/check locally instead. To bring the automatic runs back, restore:
#   push:
#   schedule:
#     - cron: "23 6 * * 1"   # weekly, so new advisories for unchanged code still fail
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SFAB_CONFIG: cdk/tests/fixtures/sfab.config.test.toml

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every tool version, shared with the deploy build's buildspec.yml. Before the cache
      # step, whose key reads CARGO_AUDIT_VERSION.
      - name: Load the pinned tool versions
        run: grep -E '^[A-Z_]+=' tool-versions.env >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-audit
            lambda/target
          key: cargo-${{ runner.os }}-${{ env.CARGO_AUDIT_VERSION }}-${{ hashFiles('lambda/rust-toolchain.toml', 'lambda/Cargo.lock') }}

      # cargo-lambda finds zig through `python3 -m ziglang`, so both go in one
      # virtual environment whose python3 comes first on PATH. Every later step
      # then gets this python3: scripts that need the project's Python call
      # cdk/.venv/bin/python by path, as scripts/check does.
      - name: Install uv and cargo-lambda (with zig)
        run: |
          pipx install "uv==${UV_VERSION}"
          uv venv "$RUNNER_TEMP/tools"
          uv pip install --python "$RUNNER_TEMP/tools/bin/python" \
            "cargo-lambda==${CARGO_LAMBDA_VERSION}" "ziglang==${ZIGLANG_VERSION}"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - name: Install the pinned Rust toolchain
        working-directory: lambda
        run: rustup toolchain install

      - name: Install cargo-audit
        run: |
          if ! cargo-audit --version 2>/dev/null | grep -q " ${CARGO_AUDIT_VERSION}$"; then
            cargo install cargo-audit --version "${CARGO_AUDIT_VERSION}" --locked --force
          fi

      - name: Check
        run: scripts/check
